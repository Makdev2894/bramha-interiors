<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bramha Interiors Logo">
  <title>Bramha Interiors</title>

  <!-- Shaktimaan five-petal lotus (36×36, centred at 18,30) -->
  <g transform="translate(18 30)">
    <g fill="#FF7A00" stroke="#D4A017" stroke-width="0.7" stroke-linejoin="round">
      <path d="M0 -16 C2.8 -10.5, 2.8 -5.5, 0 -2 C-2.8 -5.5, -2.8 -10.5, 0 -16 Z"/>
      <path d="M0 -16 C2.8 -10.5, 2.8 -5.5, 0 -2 C-2.8 -5.5, -2.8 -10.5, 0 -16 Z" transform="rotate(72)"/>
      <path d="M0 -16 C2.8 -10.5, 2.8 -5.5, 0 -2 C-2.8 -5.5, -2.8 -10.5, 0 -16 Z" transform="rotate(144)"/>
      <path d="M0 -16 C2.8 -10.5, 2.8 -5.5, 0 -2 C-2.8 -5.5, -2.8 -10.5, 0 -16 Z" transform="rotate(216)"/>
      <path d="M0 -16 C2.8 -10.5, 2.8 -5.5, 0 -2 C-2.8 -5.5, -2.8 -10.5, 0 -16 Z" transform="rotate(288)"/>
    </g>
    <circle r="3.2" fill="#D4A017"/>
  </g>

  <!-- "Bramha" — Yatra One feel, using a serif-style text block -->
  <text x="44" y="36"
        font-family="'Yatra One', 'Georgia', serif"
        font-size="26"
        font-weight="400"
        letter-spacing="0.04em"
        fill="#1A1008">Bramha</text>

  <!-- "Interiors" — lighter weight, gold tint -->
  <text x="44" y="53"
        font-family="'Lato', 'Helvetica Neue', sans-serif"
        font-size="13"
        font-weight="300"
        letter-spacing="0.18em"
        fill="#D4A017">INTERIORS</text>

  <!-- Thin gold rule under "Bramha" -->
  <line x1="44" y1="40" x2="238" y2="40" stroke="#D4A017" stroke-width="0.6" opacity="0.4"/>
</svg>
